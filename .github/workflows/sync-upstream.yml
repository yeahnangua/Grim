name: Sync Upstream

on:
  schedule:
    # Every day at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: '2.0'
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/GrimAnticheat/Grim.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Check for new commits
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/2.0)
          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "No new upstream commits (both at $LOCAL)"
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            COUNT=$(git rev-list HEAD..upstream/2.0 --count)
            echo "Upstream has $COUNT new commit(s)"
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "commit_count=$COUNT" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt merge
        id: merge
        if: steps.check.outputs.has_updates == 'true'
        run: |
          if git merge upstream/2.0 --no-edit; then
            echo "merge_ok=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "merge_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push (no conflicts)
        if: steps.merge.outputs.merge_ok == 'true'
        run: git push origin 2.0

      - name: Create PR (conflicts)
        if: steps.merge.outputs.merge_ok == 'false'
        run: |
          BRANCH="sync-upstream/$(date +%Y%m%d)"
          # Delete stale remote branch from previous failed runs
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"
          git merge upstream/2.0 --no-edit || true
          # Commit conflict markers so the PR is visible
          git add -A
          git commit -m "sync: merge upstream (conflicts need manual resolution)" --no-verify || true
          git push origin "$BRANCH"
          # Skip PR creation if one already exists for this branch
          EXISTING=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists for $BRANCH, skipping creation"
          else
            gh pr create \
              --title "sync: upstream has ${{ steps.check.outputs.commit_count }} new commits (conflicts)" \
              --body "$(cat <<'EOF'
          ## Upstream Sync

          Automatic merge from `GrimAnticheat/Grim:2.0` failed due to conflicts.

          **Action required:** resolve conflicts manually, then merge this PR.

          Conflicting files will have conflict markers (`<<<<<<<`).
          EOF
          )" \
              --base 2.0 \
              --head "$BRANCH"
          fi
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
